background: 'center / cover no-repeat url("/local/softener-bg.jpg") fixed'
views:
  - title: Softener
    path: softener
    icon: mdi:water-check
    theme: Frosted Glass
    type: sections
    max_columns: 3
    sections:
      # Status -------------------------------------------------------------
      - type: grid
        cards:
          - type: custom:bubble-card
            card_type: sub-buttons
            hide_main_background: true
            rows: 0.9
            sub_button:
              main: []
              bottom:
                - name: chips
                  buttons_layout: inline
                  justify_content: center
                  group:
                    - entity: sensor.softener_status
                      name: Status
                      show_name: false
                      show_icon: true
                      state_content: state
                      fill_width: true
                    - entity: sensor.softener_salt_level
                      name: Salt
                      show_name: false
                      show_icon: true
                      state_content: state
                      fill_width: true
                    - entity: sensor.softener_days_until_regeneration
                      name: Days
                      show_name: false
                      show_icon: true
                      state_content: state
                      fill_width: true

          # Animated salt tank.
          - type: custom:fluid-level-background-card
            grid_options:
              columns: 6
              rows: 4
            entity: sensor.softener_salt_level
            full_value: 100
            mask_image: droplet
            wave_style: realistic-performance
            wave_height: 35
            top_margin: 8
            random_start: true
            level_color: [244, 67, 54]
            background_color: [255, 255, 255, 0.04]
            severity:
              - value: 15
                color: [255, 152, 0]
              - value: 35
                color: [33, 150, 243]
            card:
              type: custom:mushroom-template-card
              layout: vertical
              primary: '{{ states("sensor.softener_salt_level") }} %'
              secondary: Salt level
              icon: >-
                {% set s = states('sensor.softener_salt_level') | float(0) %}
                {% if s < 15 %} mdi:shaker-alert {% elif s < 35 %} mdi:shaker-outline {% else %} mdi:shaker {% endif %}
              icon_color: white
              tap_action:
                action: more-info
                entity: sensor.softener_salt_level
              card_mod:
                style: |
                  ha-card {
                    background: transparent !important;
                    box-shadow: none !important;
                    border: 0 !important;
                    height: 215px;
                    justify-content: center;
                    gap: 2px;
                  }

          - type: vertical-stack
            grid_options:
              columns: 6
            cards:
              - type: custom:mushroom-template-card
                primary: Remaining
                secondary: '{{ states("sensor.softener_remaining_water") }} L'
                icon: mdi:water
                icon_color: blue
                layout: vertical
                tap_action:
                  action: more-info
                  entity: sensor.softener_remaining_water
              - type: custom:mushroom-template-card
                primary: Days left
                secondary: '{{ states("sensor.softener_days_until_regeneration") }} d'
                icon: mdi:calendar-end
                icon_color: >-
                  {% set d = states('sensor.softener_days_until_regeneration') | float(99) %}
                  {% if d <= 3 %} red {% elif d <= 7 %} orange {% else %} green {% endif %}
                layout: vertical
                tap_action:
                  action: more-info
                  entity: sensor.softener_days_until_regeneration
              - type: custom:mushroom-template-card
                primary: Flow now
                secondary: '{{ states("sensor.softener_water_flow") }} L/min'
                icon: mdi:water-pump
                icon_color: >-
                  {% if states('sensor.softener_water_flow') | float(0) > 0 %} cyan {% else %} disabled {% endif %}
                layout: vertical
                tap_action:
                  action: more-info
                  entity: sensor.softener_water_flow
                card_mod:
                  style: |
                    ha-card {
                      {% if states('sensor.softener_water_flow') | float(0) > 0 %}
                      animation: flowpulse 1.6s ease-in-out infinite;
                      {% endif %}
                    }
                    @keyframes flowpulse {
                      0%, 100% { box-shadow: 0 0 0 0 rgba(0, 188, 212, 0.55); }
                      50% { box-shadow: 0 0 0 12px rgba(0, 188, 212, 0); }
                    }

          # Shown until the softener counts the first litre.
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: sensor.softener_total_treated_water
                below: 1
            card:
              type: custom:mushroom-template-card
              grid_options:
                columns: 12
              primary: No water treated yet
              secondary: The softener counts 0 L. The graphs stay flat until water runs.
              multiline_secondary: true
              icon: mdi:water-off-outline
              icon_color: grey
              tap_action:
                action: more-info
                entity: sensor.softener_total_treated_water

          - type: conditional
            conditions:
              - condition: numeric_state
                entity: sensor.softener_salt_level
                below: 25
            card:
              type: custom:mushroom-template-card
              grid_options:
                columns: 12
              primary: Refill the salt tank
              secondary: >-
                Only {{ states('sensor.softener_salt_level') }} % left, about
                {{ states('sensor.softener_days_until_regeneration') }} days of soft water
              multiline_secondary: true
              icon: mdi:shaker-alert
              icon_color: orange
              tap_action:
                action: more-info
                entity: sensor.softener_salt_level

      # Water use ----------------------------------------------------------
      - type: grid
        cards:
          - type: horizontal-stack
            grid_options:
              columns: 12
            cards:
              - type: custom:mushroom-template-card
                primary: Used today
                secondary: '{{ states("sensor.softener_daily_consumption") }} L'
                icon: mdi:water-outline
                icon_color: blue
                layout: vertical
                tap_action:
                  action: more-info
                  entity: sensor.softener_daily_consumption
              - type: custom:mushroom-template-card
                primary: Total treated
                secondary: '{{ states("sensor.softener_total_treated_water") }} L'
                icon: mdi:chart-bar
                icon_color: teal
                layout: vertical
                tap_action:
                  action: more-info
                  entity: sensor.softener_total_treated_water

          - type: custom:mini-graph-card
            grid_options:
              columns: 12
            name: Water flow, last 24 h
            entities:
              - entity: sensor.softener_water_flow
                color: '#00bcd4'
            hours_to_show: 24
            points_per_hour: 12
            aggregate_func: max
            line_width: 3
            height: 110
            tap_action:
              action: more-info
              entity: sensor.softener_water_flow
            show:
              labels: false
              fill: true
              state: false

          - type: custom:mini-graph-card
            grid_options:
              columns: 12
            name: Softened water per day
            entities:
              - entity: sensor.softener_daily_consumption
                color: '#2196f3'
            days_to_show: 7
            group_by: date
            aggregate_func: max
            line_width: 3
            height: 120
            tap_action:
              action: more-info
              entity: sensor.softener_daily_consumption
            show:
              labels: true
              fill: true
              state: false
              extrema: true

      # Maintenance and device ---------------------------------------------
      - type: grid
        cards:
          - type: custom:mushroom-template-card
            primary: Last regen
            secondary: >-
              {% set lr = as_datetime(states('sensor.softener_last_regeneration')) %}
              {% if lr %} {{ relative_time(lr) }} ago {% else %} Never yet {% endif %}
            icon: mdi:history
            icon_color: >-
              {% set lr = as_datetime(states('sensor.softener_last_regeneration')) %}
              {% if lr %} green {% else %} disabled {% endif %}
            tap_action:
              action: none

          - type: custom:mushroom-template-card
            primary: Regenerations
            secondary: '{{ states("sensor.softener_regenerations") }} since install'
            icon: mdi:counter
            icon_color: indigo
            tap_action:
              action: more-info
              entity: sensor.softener_regenerations

          - type: custom:mushroom-template-card
            primary: Device status
            secondary: '{{ states("sensor.softener_status") }}'
            icon: mdi:state-machine
            icon_color: green
            tap_action:
              action: more-info
              entity: sensor.softener_status

          - type: custom:mushroom-template-card
            primary: Firmware
            secondary: '{{ states("sensor.softener_software_version") | trim }}'
            icon: mdi:information-outline
            icon_color: grey
            tap_action:
              action: none

          - type: custom:mushroom-template-card
            primary: Serial number
            secondary: '{{ device_attr("sensor.softener_status", "serial_number") }}'
            icon: mdi:barcode
            icon_color: grey
            tap_action:
              action: none
