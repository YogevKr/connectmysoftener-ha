background: 'center / cover no-repeat url("/local/softener-bg.jpg") fixed'
views:
  - title: Softener
    path: softener
    icon: mdi:water-check
    theme: Frosted Glass
    type: sections
    max_columns: 3
    sections:
      # Live scene ----------------------------------------------------------
      - type: grid
        cards:
          - type: custom:bubble-card
            card_type: sub-buttons
            hide_main_background: true
            rows: 0.9
            sub_button:
              main: []
              bottom:
                - name: chips
                  buttons_layout: inline
                  justify_content: center
                  group:
                    - entity: sensor.softener_status
                      name: Status
                      show_name: false
                      show_icon: true
                      state_content: state
                      fill_width: true
                    - entity: sensor.softener_salt_level
                      name: Salt
                      show_name: false
                      show_icon: true
                      state_content: state
                      fill_width: true
                    - entity: sensor.softener_days_until_regeneration
                      name: Days
                      show_name: false
                      show_icon: true
                      state_content: state
                      fill_width: true

          - type: picture-elements
            grid_options:
              columns: 12
            image: /local/softener/scene.svg
            elements:
              # salt level inside the brine tank
              - type: custom:fluid-level-background-card
                entity: sensor.softener_salt_level
                full_value: 100
                mask_image: /local/softener/tank-mask.svg
                mask_size: 100% 100%
                wave_style: realistic-performance
                wave_height: 28
                top_margin: 5
                level_opacity: 0.72
                random_start: true
                level_color: [244, 67, 54]
                background_color: [0, 0, 0, 0]
                severity:
                  - value: 15
                    color: [255, 152, 0]
                  - value: 35
                    color: [33, 150, 243]
                style:
                  left: 20%
                  top: 56.25%
                  width: 20.5%
                  height: 55.4%
                card_mod:
                  style: |
                    :host { display: block; height: 100%; }
                    #container { height: 100% !important; }
                    ha-card { height: 100% !important; }
                    hui-markdown-card { display: block; height: 100%; }
                card:
                  type: markdown
                  content: ' '
                  card_mod:
                    style: |
                      :host {
                        display: block;
                        height: 100%;
                      }
                      ha-card {
                        height: 100%;
                        margin: 0;
                        padding: 0;
                        background: transparent !important;
                        box-shadow: none !important;
                        border: 0 !important;
                      }
              # water running in the outlet pipe
              - type: custom:fluid-level-background-card
                entity: sensor.softener_water_flow
                full_value: 12
                mask_image: /local/softener/pipe-mask.svg
                mask_size: 100% 100%
                wave_style: realistic-performance
                wave_height: 18
                top_margin: 0
                level_color: [0, 229, 255]
                background_color: [0, 0, 0, 0]
                style:
                  left: 87.25%
                  top: 77.1%
                  width: 25.5%
                  height: 3.6%
                card_mod:
                  style: |
                    :host { display: block; height: 100%; }
                    #container { height: 100% !important; }
                    ha-card { height: 100% !important; }
                    hui-markdown-card { display: block; height: 100%; }
                card:
                  type: markdown
                  content: ' '
                  card_mod:
                    style: |
                      :host {
                        display: block;
                        height: 100%;
                      }
                      ha-card {
                        height: 100%;
                        margin: 0;
                        padding: 0;
                        background: transparent !important;
                        box-shadow: none !important;
                        border: 0 !important;
                      }
              # glass shine, drawn over the tank
              - type: image
                image: /local/softener/gloss.svg
                style:
                  left: 50%
                  top: 50%
                  width: 100%
                  height: 100%
              # labels
              - type: state-label
                entity: sensor.softener_salt_level
                prefix: 'Salt '
                style:
                  left: 20%
                  top: 87%
                  color: '#ffffff'
                  font-size: 14px
                  font-weight: 700
                  text-shadow: '0 1px 4px rgba(0,0,0,.85)'
                tap_action:
                  action: more-info
                  entity: sensor.softener_salt_level
              - type: state-label
                entity: sensor.softener_remaining_water
                prefix: 'Remaining '
                style:
                  left: 20%
                  top: 7%
                  color: '#cfe8f4'
                  font-size: 13px
                  font-weight: 600
                  text-shadow: '0 1px 4px rgba(0,0,0,.8)'
                tap_action:
                  action: more-info
                  entity: sensor.softener_remaining_water
              - type: state-label
                entity: sensor.softener_water_flow
                style:
                  left: 58.1%
                  top: 40.5%
                  color: '#00e5ff'
                  font-size: 17px
                  font-weight: 700
                  font-variant-numeric: tabular-nums
                  text-shadow: '0 0 10px rgba(0,229,255,.7)'
                tap_action:
                  action: more-info
                  entity: sensor.softener_water_flow
              - type: state-label
                entity: sensor.softener_days_until_regeneration
                prefix: 'Next regen in '
                style:
                  left: 58.1%
                  top: 74%
                  color: '#cfe8f4'
                  font-size: 13px
                  font-weight: 600
                  text-shadow: '0 1px 4px rgba(0,0,0,.8)'
                tap_action:
                  action: more-info
                  entity: sensor.softener_days_until_regeneration
              - type: state-label
                entity: sensor.softener_status
                style:
                  left: 89%
                  top: 7%
                  color: '#7ef2a8'
                  font-size: 12px
                  font-weight: 600
                  text-shadow: '0 1px 4px rgba(0,0,0,.8)'
                tap_action:
                  action: more-info
                  entity: sensor.softener_status

          # Shown until the softener counts the first litre.
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: sensor.softener_total_treated_water
                below: 1
            card:
              type: custom:mushroom-template-card
              grid_options:
                columns: 12
              primary: No water treated yet
              secondary: The softener counts 0 L. The graphs stay flat until water runs.
              multiline_secondary: true
              icon: mdi:water-off-outline
              icon_color: grey
              tap_action:
                action: more-info
                entity: sensor.softener_total_treated_water

          - type: conditional
            conditions:
              - condition: numeric_state
                entity: sensor.softener_salt_level
                below: 25
            card:
              type: custom:mushroom-template-card
              grid_options:
                columns: 12
              primary: Refill the salt tank
              secondary: >-
                Only {{ states('sensor.softener_salt_level') }} % left, about
                {{ states('sensor.softener_days_until_regeneration') }} days of soft water
              multiline_secondary: true
              icon: mdi:shaker-alert
              icon_color: orange
              tap_action:
                action: more-info
                entity: sensor.softener_salt_level

      # Water use ----------------------------------------------------------
      - type: grid
        cards:
          - type: horizontal-stack
            grid_options:
              columns: 12
            cards:
              - type: custom:mushroom-template-card
                primary: Used today
                secondary: '{{ states("sensor.softener_daily_consumption") }} L'
                icon: mdi:water-outline
                icon_color: blue
                layout: vertical
                tap_action:
                  action: more-info
                  entity: sensor.softener_daily_consumption
              - type: custom:mushroom-template-card
                primary: Total treated
                secondary: '{{ states("sensor.softener_total_treated_water") }} L'
                icon: mdi:chart-bar
                icon_color: teal
                layout: vertical
                tap_action:
                  action: more-info
                  entity: sensor.softener_total_treated_water

          - type: custom:mini-graph-card
            grid_options:
              columns: 12
            name: Water flow, last 24 h
            entities:
              - entity: sensor.softener_water_flow
                color: '#00bcd4'
            hours_to_show: 24
            points_per_hour: 12
            aggregate_func: max
            line_width: 3
            height: 110
            tap_action:
              action: more-info
              entity: sensor.softener_water_flow
            show:
              labels: false
              fill: true
              state: false

          - type: custom:mini-graph-card
            grid_options:
              columns: 12
            name: Softened water per day
            entities:
              - entity: sensor.softener_daily_consumption
                color: '#2196f3'
            days_to_show: 7
            group_by: date
            aggregate_func: max
            line_width: 3
            height: 120
            tap_action:
              action: more-info
              entity: sensor.softener_daily_consumption
            show:
              labels: true
              fill: true
              state: false
              extrema: true

      # Maintenance and device ---------------------------------------------
      - type: grid
        cards:
          - type: custom:mushroom-template-card
            primary: Last regen
            secondary: >-
              {% set lr = as_datetime(states('sensor.softener_last_regeneration')) %}
              {% if lr %} {{ relative_time(lr) }} ago {% else %} Never yet {% endif %}
            icon: mdi:history
            icon_color: >-
              {% set lr = as_datetime(states('sensor.softener_last_regeneration')) %}
              {% if lr %} green {% else %} disabled {% endif %}
            tap_action:
              action: none

          - type: custom:mushroom-template-card
            primary: Regenerations
            secondary: '{{ states("sensor.softener_regenerations") }} since install'
            icon: mdi:counter
            icon_color: indigo
            tap_action:
              action: more-info
              entity: sensor.softener_regenerations

          - type: custom:mushroom-template-card
            primary: Device status
            secondary: '{{ states("sensor.softener_status") }}'
            icon: mdi:state-machine
            icon_color: green
            tap_action:
              action: more-info
              entity: sensor.softener_status

          - type: custom:mushroom-template-card
            primary: Firmware
            secondary: '{{ states("sensor.softener_software_version") | trim }}'
            icon: mdi:information-outline
            icon_color: grey
            tap_action:
              action: none

          - type: custom:mushroom-template-card
            primary: Serial number
            secondary: '{{ device_attr("sensor.softener_status", "serial_number") }}'
            icon: mdi:barcode
            icon_color: grey
            tap_action:
              action: none
